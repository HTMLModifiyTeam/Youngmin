<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>1994 컴퓨터</title>
<meta name="description" content="1994년의 오래된 컴퓨터를 켜서 안을 들여다보는 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=202610180201">
</head>
<body class="scene">
  <div id="room" class="room">
    <div id="stage" class="stage">
      <div class="wall"></div><div class="desk"></div>

      <!-- 스피커 (왼쪽) -->
      <div class="spk spk-l"><i class="grille"></i><i class="spk-base"></i></div>

      <!-- 본체 -->
      <div id="tower" class="tower">
        <div class="bay b525"><i></i></div>
        <div class="bay b35"><i></i></div>
        <div class="tw-leds"><i id="pwrLed" class="tl"></i><i id="hddLed" class="tl hdd"></i></div>
        <button id="towerPower" class="tw-power" aria-label="본체 전원"></button>
        <div class="tw-vent"></div>
      </div>

      <!-- 모니터 -->
      <div id="pc" class="pc">
        <div class="monitor">
          <div class="bezel">
            <div class="glass">
              <div id="screen" class="screen off"></div>
              <div class="scan"></div><div class="glare"></div>
            </div>
          </div>
          <div class="chin">
            <span class="knobs"><i></i><i></i><i></i><i></i></span>
            <i id="led" class="led"></i>
            <button id="power" class="power" aria-label="전원"></button>
          </div>
        </div>
        <div class="neck"></div><div class="foot"></div>
        <button id="zoomHit" class="zoom-hit" aria-label="모니터 가까이 보기"></button>
      </div>

      <!-- 스피커 (오른쪽) -->
      <div class="spk spk-r"><i class="grille"></i><i class="spk-base"><b></b><b></b></i></div>

      <!-- 키보드 · 마우스 -->
      <div class="kbd"><div class="keys"></div><div class="keys num"></div></div>
      <div class="mouse"><i></i></div>

      <!-- 휴대전화 -->
      <div id="phone" class="phone">
        <i class="ant"></i>
        <div class="ph-body">
          <i class="ph-spk"></i>
          <div class="ph-lcd"><span id="phTime"></span></div>
          <i class="ph-nav"></i>
          <div class="ph-keys"></div>
        </div>
      </div>
    </div>
    <button id="back" class="back" hidden>← 책상으로</button>
    <p id="hint" class="hint">모니터를 누르세요</p>
  </div>
  <script src="data.js?v=202610180201"></script>
  <script src="app.js?v=202610180201"></script>
</body>
</html>
